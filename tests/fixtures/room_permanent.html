                case 9:
                case 12:
                case 16:
                default:
                    return ""
            }
        }

        /** Vrací čas ve formátu H:mm */
        self.FormattedTime = (time) => {
            if (!time) return "";

            const now = new Date(); // aktuální datum a čas
            // Vytvoř časový objekt
            const [hours, minutes, seconds] = time.split(":").map(Number);
            const date = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate(),
                hours,
                minutes,
                seconds || 0
            );

            Globalize.locale(currentLangCode);

            // Zformátuj pouze čas
            const formatTime = Globalize.dateFormatter({ time: "short" });
            return formatTime(date);
        }

        /**
         * Detekuje překrývající se atomy a přiřadí jim stack level pro odsazení.
         * @param {Array} hours - seznam hodin v jednom dni
         */
        function assignStackLevels(hours) {
            // Sběr všech atomů v daném dni
            let atoms = [];
            hours?.forEach((hour, hourIndex) => {
                hour.Atoms?.forEach(atom => {
                    atoms.push({
                        atom: atom,
                        begin: atom.Begin,
                        end: atom.End,
                        hourIndex: hourIndex
                    });
                });
            });

            // Seřazení podle začátku
            atoms.sort((a, b) => a.begin.localeCompare(b.begin));

            // Pole, kde index je stack level a hodnota je end čas posledního atomu na tomto levelu
            let levels = [];

            atoms.forEach(item => {
                // Najdi první volný stack level
                let assigned = false;
                for (let i = 0; i < levels.length; i++) {
                    if (item.begin >= levels[i]) {
                        levels[i] = item.end;
                        item.atom.StackLevel = i;
                        assigned = true;
                        break;
                    }
                }
                if (!assigned) {
                    // Nový stack level
                    levels.push(item.end);
                    item.atom.StackLevel = levels.length - 1;
                }
            });
        }
    }

    var timetableContentModel = new TimetableContent();

    $(() => {
        ko.applyBindings(timetableContentModel, document.getElementById("_timetableContent"));
        ActionsOnContentReady();
    });
</script>
