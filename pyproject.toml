[project]
name = "rozvrh-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Bakaláři public timetables (class, teacher, room)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
rozvrh-mcp = "rozvrh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rozvrh_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
